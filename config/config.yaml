fingerprint:
  enable_geo_consistency: true
  enable_canvas_randomization: true
  enable_webrtc_protection: true
  enable_advanced_stealth: true
  enable_ai_behavior: true
  stealth_level: "expert"  # basic, advanced, expert
  
  # Optional Fingerprint Persistence (for consistency across restarts)
  persistence:
    enabled: false                    # ✅ Enable for fingerprint consistency
    storage_mode: "memory"            # ✅ "memory", "encrypted_file", "secure_temp"
    cache_file: "fingerprint_cache.json"
    auto_save: true                   # Auto-save after each fingerprint generation
    backup_enabled: true              # Create backup before overwriting
    max_cache_size: 1000              # Maximum number of cached fingerprints
    cleanup_interval: 86400           # Cleanup old entries every 24 hours (seconds)
    
    # ✅ STEALTH ENHANCEMENTS - Anti-Detection for File Operations
    stealth_file_ops:
      enabled: true                   # ✅ Enable stealth file operations
      use_memory_cache: true          # ✅ Prefer in-memory over disk
      delayed_writes: true            # ✅ Delay file writes to avoid detection
      write_delay_min: 30             # ✅ Minimum delay before writing (seconds)
      write_delay_max: 300            # ✅ Maximum delay before writing (seconds)
      encrypted_storage: true         # ✅ Encrypt cache files
      temp_file_cleanup: true         # ✅ Clean temp files immediately
      randomize_filenames: true       # ✅ Use random cache file names
      obfuscate_content: true         # ✅ Obfuscate file content
  
  # Optional Hardware Profile Persistence
  hardware_persistence:
    enabled: false                    # ✅ Enable for hardware consistency
    storage_mode: "memory"            # ✅ "memory", "encrypted_file", "secure_temp"
    cache_file: "hardware_cache.json"
    auto_save: true                   # Auto-save after each hardware profile generation
    backup_enabled: true              # Create backup before overwriting
    max_cache_size: 500               # Maximum number of cached hardware profiles
    cleanup_interval: 86400           # Cleanup old entries every 24 hours (seconds)
    
    # ✅ STEALTH ENHANCEMENTS - Anti-Detection for File Operations
    stealth_file_ops:
      enabled: true                   # ✅ Enable stealth file operations
      use_memory_cache: true          # ✅ Prefer in-memory over disk
      delayed_writes: true            # ✅ Delay file writes to avoid detection
      write_delay_min: 30             # ✅ Minimum delay before writing (seconds)
      write_delay_max: 300            # ✅ Maximum delay before writing (seconds)
      encrypted_storage: true         # ✅ Encrypt cache files
      temp_file_cleanup: true         # ✅ Clean temp files immediately
      randomize_filenames: true       # ✅ Use random cache file names
      obfuscate_content: true         # ✅ Obfuscate file content
  
  # Optional Consistency Monitoring
  consistency_monitoring:
    enabled: false                    # ✅ Enable for fingerprint change detection
    log_changes: true                 # Log when fingerprints change
    alert_on_inconsistency: false     # Alert when same proxy gets different fingerprint
    track_changes: true               # Track fingerprint changes over time
    change_threshold: 0.8             # Alert if consistency drops below 80%
    
    # ✅ STEALTH ENHANCEMENTS - Memory-Only Monitoring
    stealth_monitoring:
      enabled: true                   # ✅ Enable stealth monitoring
      memory_only: true               # ✅ Keep all tracking in memory only
      no_disk_writes: true            # ✅ Never write monitoring data to disk
      encrypted_logs: true            # ✅ Encrypt log data in memory
      auto_cleanup: true              # ✅ Auto-cleanup monitoring data

# Advanced Undetectable Traffic Settings
undetectable_traffic:
  enabled: true
  
  # Mouse Movement Simulation
  mouse_simulation:
    enabled: true
    movement_patterns:
      linear: 0.3      # 30% straight movements
      curved: 0.5      # 50% curved movements (Bezier curves)
      hesitation: 0.2  # 20% hesitant movements
    human_variations:
      micro_tremors: true
      speed_variations: true
      pause_patterns: true
      overshoot_correction: true
    speed_config:
      min_speed: 100    # pixels per second
      max_speed: 800    # pixels per second
  
  # Hardware Emulation
  hardware_emulation:
    enabled: true
    device_types:
      - "desktop_windows"
      - "desktop_mac"
      - "laptop_windows"
    network_profiles:
      - "home_wifi"
      - "mobile_4g"
      - "office_ethernet"
    performance_simulation: true
    sensor_emulation: true
  
  # Advanced Behavior Patterns
  behavior_patterns:
    enabled: true
    decision_tree_complexity: "advanced"  # basic, intermediate, advanced
    context_awareness: true
    personality_traits: true
    attention_patterns: true
    break_patterns: true
  
  # Anti-Detection Measures
  anti_detection:
    enabled: true
    webdriver_protection: true
    automation_detection: true
    canvas_fingerprint_randomization: true
    webrtc_protection: true
    battery_api_spoofing: true
    connection_api_spoofing: true
    performance_timing_randomization: true

# AdSense Testing Monitor Settings with HIGH CPC Focus
adsense_testing:
  enabled: true
  safety_thresholds:
    max_daily_sessions: 50
    max_revenue_per_session: 0.02  # $0.02 (realistic)
    max_ctr_per_session: 0.05      # 5%
    min_session_duration: 240      # 4 minutes
    max_hourly_sessions: 10
    min_session_spacing: 60        # 1 minute
    target_cpc_threshold: 0.10     # Target $0.10+ CPC (realistic)
  suspicious_pattern_detection:
    enabled: true
    rapid_clicking_threshold: 10   # clicks per minute
    perfect_timing_threshold: 0.9  # 90% consistency
    excessive_scrolling_threshold: 100  # scrolls per minute
  compliance_monitoring:
    enabled: true
    report_generation: true
    alert_threshold: 0.8  # 80% suspicious behavior
  
  # HIGH CPC Focus Configuration - STEALTH FOCUSED
  high_cpc_focus:
    enabled: true
    
    display_ad_positions:
      - "top"
      - "sidebar"
      - "in-content"
      - "bottom"
    
    impression_time_strategies:
      minimum_view_time: 10      # 10 seconds minimum (realistic)
      optimal_view_time: 20      # 20 seconds optimal (realistic)
      maximum_view_time: 60      # 1 minute maximum (realistic)
      scroll_into_view_probability: 0.2  # 20% chance (realistic)
      hover_over_ad_probability: 0.1     # 10% chance (realistic)
      click_probability: 0.001           # 0.1% chance (realistic for display ads)
    
    revenue_optimization:
      premium_content_focus: true
      high_value_keywords: true
      long_session_optimization: true
      natural_engagement: true

# Error Handling Configuration
error_handling:
  max_retries: 3
  base_delay: 1
  max_delay: 60
  backoff_factor: 2
  jitter: 0.1
  max_errors_per_hour: 10
  max_errors_per_session: 3
  critical_error_threshold: 5
  
  # Production Recovery Settings
  auto_recovery: true
  recovery_check_interval: 300  # 5 minutes
  max_recovery_attempts: 5
  recovery_backoff_factor: 1.5
  graceful_degradation: true

# Logging Configuration
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  file: "logs/bot.log"
  max_size: "10MB"
  backup_count: 5
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Testing Mode Settings
