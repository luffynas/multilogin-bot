# Multi-Login Bot Configuration for AdSense Testing
# ================================================
# SETUP INSTRUCTIONS:
# 1. Replace YOUR_MULTILOGIN_API_KEY with your actual API key
# 2. Replace your-target-website.com with your actual target website
# 3. Update proxy credentials if using different provider
# 4. Adjust daily_visits_min/max based on your testing needs

multilogin:
  # ⚠️ MULTILOGIN X SETUP INSTRUCTIONS:
  # 1. Use your Multilogin X account credentials (email & password)
  # 2. The system will automatically sign in and get bearer token
  # 3. No manual API key generation needed
  
  # ✅ MULTILOGIN X CLOUD API (OFFICIAL DOCUMENTATION)
  base_url: "https://api.multilogin.com"
  launcher_url: "https://launcher.mlx.yt:45001/api/v1"
  
  # ✅ ACCOUNT CREDENTIALS (for automatic sign in)
  username: "blankblank026@gmail.com"  # ⚠️ REPLACE WITH YOUR EMAIL
  password: "DadiDuwit2025$"  # ⚠️ REPLACE WITH YOUR PASSWORD
  
  # ⚠️ NO API KEY NEEDED - System will auto-generate bearer token
  api_key: "AUTO_GENERATED"  # Will be generated automatically after sign in
  
  max_concurrent_profiles: 20  # Increased for high-volume processing
  profile_timeout: 1800  # 30 minutes

# Concurrent Execution Configuration
concurrent_execution:
  enabled: true  # Enable concurrent execution for high-volume processing
  max_concurrent_profiles: 20  # Maximum concurrent profiles (adjust based on system resources)
  thread_safety: true  # Enable thread safety for shared resources
  batch_processing: true  # Enable batch processing for large proxy pools
  batch_size: 50  # Number of sessions per batch
  batch_delay: 300  # Delay between batches (5 minutes)

proxy:
  # Global Proxy Settings
  type: "socks5"
  total_count: 1000  # Increased to 1000 proxies for high-volume processing
  daily_limit_per_proxy: 1
  health_check_interval: 180  # 3 minutes
  success_rate_min: 0.9       # 90% success rate requirement
  response_time_max: 5.0      # 5 seconds max response time
  
  # Production Monitoring & Alerting
  alert_threshold: 0.2        # Alert jika < 20% proxy tersedia
  critical_threshold: 0.1     # Critical alert jika < 10% proxy tersedia
  auto_fallback: true         # Enable automatic provider fallback
  fallback_delay: 60          # Delay sebelum fallback (seconds)
  max_fallback_retries: 3     # Maximum retry attempts
  
  # Unified Multi-Provider Configuration (Priority-based)
  # Supported: oxylabs, brightdata, socksescort, nodemaven, decodo, proxyempire, netnut, soax, iproyal
  providers:
    - name: "socksescort"      # PRIMARY PROVIDER (was legacy default)
      priority: 1
      enabled: true            # ✅ ENABLED - Primary provider
      primary: true            # Mark as primary provider
      credentials:
        username: "your_socksescort_username"
        password: "your_socksescort_password"
    - name: "oxylabs"
      priority: 2
      enabled: false           # ❌ DISABLED - Fallback only
      credentials:
        username: "your_oxylabs_username"
        password: "your_oxylabs_password"
    - name: "brightdata"
      priority: 3
      enabled: false           # ❌ DISABLED - Fallback only
      credentials:
        username: "your_brightdata_username"
        password: "your_brightdata_password"
    - name: "nodemaven"
      priority: 4
      enabled: false           # ❌ DISABLED - Fallback only
      credentials:
        username: "your_nodemaven_username"
        password: "your_nodemaven_password"
    - name: "decodo"
      priority: 5
      enabled: false           # ❌ DISABLED - Fallback only
      credentials:
        username: "your_decodo_username"
        password: "your_decodo_password"
    - name: "proxyempire"
      priority: 6
      enabled: false           # ❌ DISABLED - Fallback only
      credentials:
        username: "your_proxyempire_username"
        password: "your_proxyempire_password"
    - name: "netnut"
      priority: 7
      enabled: false           # ❌ DISABLED - Fallback only
      credentials:
        username: "your_netnut_username"
        password: "your_netnut_password"
    - name: "soax"
      priority: 8
      enabled: false           # ❌ DISABLED - Fallback only
      credentials:
        username: "your_soax_username"
        password: "your_soax_password"
    - name: "iproyal"
      priority: 9
      enabled: false           # ❌ DISABLED - Fallback only
      credentials:
        username: "your_iproyal_username"
        password: "your_iproyal_password"

# Dynamic Entry Point Configuration
dynamic_entry_points:
  enabled: true
  target_websites:
    primary:
      url: "https://dev-plugin.local/"
      weight: 0.7
    secondary:
      url: "https://dev-plugin.local/category/technology"
      weight: 0.2
    tertiary:
      url: "https://dev-plugin.local/category/lifestyle"
      weight: 0.1
  entry_point_types:
    organic_search:
      enabled: true
      weight: 0.35
    social_media:
      enabled: true
      weight: 0.25
    direct_traffic:
      enabled: true
      weight: 0.20
    referral:
      enabled: true
      weight: 0.15
    paid_ads:
      enabled: false
      weight: 0.05
  
  # Custom Keywords Configuration (Optional)
  custom_keywords:
    enabled: true  # Set true to use custom keywords file
    keywords_file: "../config/keywords.json"  # Path to custom keywords file
    fallback_to_categories: true  # Use target_categories if file not found
    merge_with_categories: false  # Merge custom keywords with category keywords
    keywords_per_category: 10  # Number of keywords to use per category
    custom_search_engines: ["google", "bing"]  # Override default search engines (optional)
    # Example: ["google", "bing"] - if empty, uses default: ["google", "bing", "yahoo", "duckduckgo"]
  
  # Custom Referrer Domains Configuration (Optional)
  custom_referrer_domains:
    enabled: true  # Set true to use custom referrer domains file
    referrer_file: "../config/referrer_domains.json"  # Path to custom referrer domains file
    fallback_to_defaults: true  # Use default domains if file not found
    merge_with_defaults: false  # Merge custom domains with default domains
    domains_per_category: 15  # Number of domains to use per category
    geo_specific: true  # Use geo-specific domains based on proxy location

# Content Analysis Configuration
