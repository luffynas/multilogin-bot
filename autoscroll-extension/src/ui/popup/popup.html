<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autoscroll Extension</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <div class="header">
      <div class="logo">
        <img src="../../icons/icon32.png" alt="Autoscroll" class="logo-icon">
        <h1 class="title">Autoscroll</h1>
      </div>
      <div class="status-indicator">
        <div class="status-dot" id="statusDot"></div>
        <span class="status-text" id="statusText">Stopped</span>
      </div>
    </div>

    <!-- Main Controls -->
    <div class="main-controls">
      <button id="startStopBtn" class="control-btn primary">
        <span class="btn-icon">▶</span>
        <span class="btn-text">Start</span>
      </button>
      
      <button id="pauseBtn" class="control-btn secondary" disabled>
        <span class="btn-icon">⏸</span>
        <span class="btn-text">Pause</span>
      </button>
    </div>

    <!-- Profile Selection -->
    <div class="profile-section">
      <label for="profileSelect" class="section-label">Profile:</label>
      <select id="profileSelect" class="profile-select">
        <option value="default">Default Profile</option>
        <option value="advanced">Advanced Stealth</option>
      </select>
    </div>

    <!-- Strategy Selection -->
    <div class="strategy-section">
      <label for="strategySelect" class="section-label">Strategy:</label>
      <select id="strategySelect" class="strategy-select">
        <option value="linear">Linear</option>
        <option value="momentum">Momentum</option>
        <option value="burst">Burst</option>
      </select>
    </div>

    <!-- Speed Control -->
    <div class="speed-section">
      <label for="speedSlider" class="section-label">Speed:</label>
      <div class="speed-control">
        <input type="range" id="speedSlider" class="speed-slider" min="0.5" max="2.0" step="0.1" value="1.0">
        <span class="speed-value" id="speedValue">1.0x</span>
      </div>
    </div>

    <!-- Statistics -->
    <div class="stats-section">
      <div class="stats-header">
        <h3 class="stats-title">Statistics</h3>
        <button id="resetStatsBtn" class="reset-btn">Reset</button>
      </div>
      <div class="stats-grid">
        <div class="stat-item">
          <span class="stat-label">Steps:</span>
          <span class="stat-value" id="stepsValue">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Distance:</span>
          <span class="stat-value" id="distanceValue">0px</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Duration:</span>
          <span class="stat-value" id="durationValue">0s</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Errors:</span>
          <span class="stat-value" id="errorsValue">0</span>
        </div>
      </div>
    </div>

    <!-- Navigation Controls -->
    <div class="navigation-section">
      <div class="nav-header">
        <h3 class="nav-title">Navigation</h3>
        <label class="switch">
          <input type="checkbox" id="autoNavigateToggle">
          <span class="slider"></span>
        </label>
      </div>
      <div class="nav-controls">
        <select id="navModeSelect" class="nav-select">
          <option value="sameTab">Same Tab</option>
          <option value="newTab">New Tab</option>
        </select>
        <select id="navTargetSelect" class="nav-select">
          <option value="next">Next Page</option>
          <option value="prev">Previous Page</option>
          <option value="related">Related Posts</option>
        </select>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <button id="optionsBtn" class="footer-btn">Options</button>
      <button id="helpBtn" class="footer-btn">Help</button>
    </div>
  </div>

  <!-- Loading Overlay -->
  <div id="loadingOverlay" class="loading-overlay hidden">
    <div class="loading-spinner"></div>
    <p class="loading-text">Loading...</p>
  </div>

  <!-- Error Toast -->
  <div id="errorToast" class="error-toast hidden">
    <div class="toast-content">
      <span class="toast-icon">⚠</span>
      <span class="toast-message" id="errorMessage"></span>
    </div>
    <button class="toast-close" id="errorClose">×</button>
  </div>

  <!-- Success Toast -->
  <div id="successToast" class="success-toast hidden">
    <div class="toast-content">
      <span class="toast-icon">✓</span>
      <span class="toast-message" id="successMessage"></span>
    </div>
    <button class="toast-close" id="successClose">×</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
