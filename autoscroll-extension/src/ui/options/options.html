<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autoscroll Extension - Options</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Autoscroll Extension Settings</h1>
      <p>Configure your autoscroll behavior and preferences</p>
    </header>

    <div id="message" class="message" style="display: none;"></div>

    <main>
      <!-- Basic Settings -->
      <section class="settings-section">
        <h2>Basic Settings</h2>
        
        <div class="form-group">
          <label for="profileSelect">Active Profile:</label>
          <select id="profileSelect" class="form-control">
            <option value="default">Default</option>
            <option value="fast">Fast</option>
            <option value="slow">Slow</option>
            <option value="custom">Custom</option>
          </select>
        </div>

        <div class="form-group">
          <label for="strategySelect">Scroll Strategy:</label>
          <select id="strategySelect" class="form-control">
            <option value="linear">Linear</option>
            <option value="exponential">Exponential</option>
            <option value="sine">Sine Wave</option>
            <option value="random">Random</option>
            <option value="adaptive">Adaptive</option>
          </select>
        </div>

        <div class="form-group">
          <label for="speedSlider">Scroll Speed: <span id="speedValue">1.0x</span></label>
          <input type="range" id="speedSlider" class="form-control" min="0.1" max="5.0" step="0.1" value="1.0">
        </div>
      </section>

      <!-- Navigation Settings -->
      <section class="settings-section">
        <h2>Navigation Settings</h2>
        
        <div class="form-group">
          <label class="checkbox-label">
            <input type="checkbox" id="autoNavigateToggle">
            <span class="checkmark"></span>
            Enable Auto Navigation
          </label>
        </div>

        <div class="form-group">
          <label for="navModeSelect">Navigation Mode:</label>
          <select id="navModeSelect" class="form-control">
            <option value="sameTab">Same Tab</option>
            <option value="newTab">New Tab</option>
            <option value="backgroundTab">Background Tab</option>
          </select>
        </div>

        <div class="form-group">
          <label for="navTargetSelect">Navigation Target:</label>
          <select id="navTargetSelect" class="form-control">
            <option value="next">Next Post</option>
            <option value="previous">Previous Post</option>
            <option value="related">Related Post</option>
            <option value="recent">Recent Post</option>
            <option value="random">Random Post</option>
          </select>
        </div>
      </section>

      <!-- Stealth Settings -->
      <section class="settings-section">
        <h2>Stealth Settings</h2>
        
        <div class="form-group">
          <label for="stealthLevelSelect">Stealth Level:</label>
          <select id="stealthLevelSelect" class="form-control">
            <option value="basic">Basic</option>
            <option value="intermediate">Intermediate</option>
            <option value="advanced">Advanced</option>
            <option value="expert">Expert</option>
          </select>
        </div>

        <div class="form-group">
          <label class="checkbox-label">
            <input type="checkbox" id="debugModeToggle">
            <span class="checkmark"></span>
            Enable Debug Mode
          </label>
        </div>
      </section>

      <!-- Advanced Settings -->
      <section class="settings-section">
        <h2>Advanced Settings</h2>
        
        <div class="form-group">
          <label for="noiseLevel">Noise Level:</label>
          <input type="range" id="noiseLevel" class="form-control" min="0" max="100" step="1" value="50">
          <span class="range-value">50%</span>
        </div>

        <div class="form-group">
          <label for="dwellTime">Dwell Time (seconds):</label>
          <input type="range" id="dwellTime" class="form-control" min="1" max="30" step="1" value="5">
          <span class="range-value">5s</span>
        </div>

        <div class="form-group">
          <label for="scrollVariation">Scroll Variation:</label>
          <input type="range" id="scrollVariation" class="form-control" min="0" max="100" step="1" value="20">
          <span class="range-value">20%</span>
        </div>
      </section>

      <!-- Profile Management -->
      <section class="settings-section">
        <h2>Profile Management</h2>
        
        <div class="form-group">
          <label for="profileName">Profile Name:</label>
          <input type="text" id="profileName" class="form-control" placeholder="Enter profile name">
        </div>

        <div class="button-group">
          <button id="createProfileBtn" class="btn btn-secondary">Create Profile</button>
          <button id="deleteProfileBtn" class="btn btn-danger">Delete Profile</button>
        </div>
      </section>

      <!-- Import/Export -->
      <section class="settings-section">
        <h2>Import/Export</h2>
        
        <div class="button-group">
          <button id="exportBtn" class="btn btn-primary">Export Settings</button>
          <button id="importBtn" class="btn btn-secondary">Import Settings</button>
          <input type="file" id="importFile" accept=".json" style="display: none;">
        </div>
      </section>

      <!-- Statistics -->
      <section class="settings-section">
        <h2>Statistics</h2>
        
        <div class="stats-grid">
          <div class="stat-item">
            <span class="stat-label">Total Scroll Time:</span>
            <span class="stat-value" id="totalScrollTime">0h 0m</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Pages Scrolled:</span>
            <span class="stat-value" id="pagesScrolled">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Navigation Clicks:</span>
            <span class="stat-value" id="navigationClicks">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Stealth Events:</span>
            <span class="stat-value" id="stealthEvents">0</span>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <div class="button-group">
        <button id="saveBtn" class="btn btn-primary">Save Settings</button>
        <button id="resetBtn" class="btn btn-secondary">Reset to Default</button>
      </div>
    </footer>
  </div>

  <script src="options.js"></script>
</body>
</html>
