# Multilogin API Configuration
multilogin:
  base_url: "https://api.multilogin.com"
  launcher_url: "https://launcher.mlx.yt:45001/api/v2"
  localhost: "http://127.0.0.1"
  
  # Account credentials for automatic authentication
  username: "blankblank026@gmail.com"
  password: "DadiDuwit2025$"
  
  # Profile management
  max_concurrent_profiles: 20
  profile_timeout: 1800  # 30 minutes
  auto_cleanup: true

# Proxy Configuration - Multi-Provider Support (SOCKS5)
proxy:
  # Dynamic proxy pool management
  total_count: 2000  # Total static proxies available
  rotation_strategy: "daily"  # daily, hourly, session
  health_check_interval: 300  # 5 minutes
  success_rate_min: 0.85
  response_time_max: 5.0
  
  # Proxy protocol configuration
  protocol: "socks5"  # Always use SOCKS5
  authentication: "basic"  # basic, none
  
  # Dynamic proxy rotation schedule
  rotation_period_days: 10  # Use all 2000 proxies in 10 days (configurable)
  daily_proxy_target: 200   # 2000 / 10 days = 200 proxies per day
  
  # Multi-provider configuration with fallback
  providers:
    # Primary: Multilogin built-in residential proxies (5GB)
    - name: "multilogin_residential"
      priority: 1
      enabled: true
      type: "residential"
      source: "multilogin_builtin"
      data_limit: "5GB"
      protocol: "socks5"
      credentials:
        username: ""  # Not needed for built-in proxies
        password: ""  # Not needed for built-in proxies
      settings:
        auto_use: true
        fallback_enabled: true
    
    # Fallback: SocksEscort
    - name: "socksescort"
      priority: 2
      enabled: true
      type: "static"
      source: "socksescort"
      protocol: "socks5"
      credentials:
        username: "your_socksescort_username"
        password: "your_socksescort_password"
      settings:
        auto_use: false  # Manual activation
        fallback_enabled: true
        api_endpoint: "https://socksescort.com/api"
  
  # Provider switching configuration
  provider_switching:
    enabled: true
    auto_fallback: true
    manual_switch: true
    switch_conditions:
      data_limit_reached: true
      health_score_below: 0.3
      success_rate_below: 0.7
      max_failures: 10
  
  # Proxy health monitoring
  health_monitoring:
    enabled: true
    check_interval: 1800  # 30 minutes
    max_failures: 3
    auto_blacklist: true
    blacklist_duration: 3600  # 1 hour

# Profile Configuration - Dynamic Count
profiles:
  # Dynamic profile count - can be adjusted via command line
  total_count: 100  # Default, can be overridden
  fingerprint_strategy: "unique_per_proxy"
  geo_default: "US"  # Tier 1 targeting - US geolocation
  
  # Fingerprint settings for undetectable behavior
  fingerprint:
    enable_geo_consistency: true
    enable_canvas_randomization: true
    enable_webrtc_protection: true
    enable_advanced_stealth: true
    stealth_level: "expert"
    
    # Hardware emulation for Tier 1 markets
    hardware_emulation:
      enabled: true
      device_types:
        - "desktop_windows"
        - "desktop_mac"
        - "laptop_windows"
      network_profiles:
        - "home_wifi"
        - "mobile_4g"
        - "office_ethernet"
    
    # Tier 1 market specific settings
    tier1_targeting:
      enabled: true
      countries: ["US", "CA", "GB", "AU", "DE", "FR", "NL"]
      timezones:
        US: ["America/New_York", "America/Chicago", "America/Denver", "America/Los_Angeles"]
        CA: ["America/Toronto", "America/Vancouver"]
        GB: ["Europe/London"]
        AU: ["Australia/Sydney", "Australia/Melbourne"]
        DE: ["Europe/Berlin"]
        FR: ["Europe/Paris"]
        NL: ["Europe/Amsterdam"]

# Selenium Automation Configuration - Human-like Behavior
selenium:
  automation_type: "selenium"
  undetectable_mode: true
  headless: false  # Set to true for production
  
  # Enhanced human-like behavior simulation
  human_behavior:
    enabled: true
    mouse_movement: true
    random_delays: true
    natural_scrolling: true
    realistic_typing: true
    
    # Advanced human simulation
    click_simulation:
      enabled: true
      natural_click_patterns: true
      hover_before_click: true
      click_delay_variation: true
      double_click_probability: 0.05
    
    # 🔥 STEALTH ENHANCEMENT: Traffic Generation Patterns
    traffic_generation:
      enabled: true
      natural_browsing_patterns: true
      page_dwell_time: [180, 300]  # 3-5 minutes per page (was 30-180)
      scroll_behavior: "natural"
      tab_switching: true
      bookmark_creation: true
    
    # Real human behavior simulation
    realistic_behavior:
      enabled: true
      attention_span_variation: true
      reading_speed_variation: true
      mouse_acceleration: true
      keyboard_typing_patterns: true
      browser_navigation_patterns: true
    
    # 🔥 STEALTH ENHANCEMENT: Enhanced Timing Variations
    min_delay: 1
    max_delay: 5
    scroll_interval_min: 0.5  # 0.5 seconds between scrolls (faster speed)
    scroll_interval_max: 1.5  # 1.5 seconds max between scrolls (faster speed)
  
  # 🔥 STEALTH ENHANCEMENT: Realistic Browsing Behavior Configuration
  browsing_behavior:
    enabled: true
    min_pages: 1          # Minimum 1 page per session
    max_pages: 3          # Maximum 3 pages per session
    page_dwell_time: [180, 300]  # 3-5 minutes per page (was 30-180)
    navigation_probabilities:
      category: 0.4
      legal: 0.3
      previous_next: 0.8  # Increased probability for previous/next (was 0.6)
      random: 0.1
    
    # Reading behavior simulation
    reading_behavior:
      enabled: true
      chars_per_second: 200
      max_reading_time: 30
      text_selectors:
        - "p"
        - "article"
        - ".content"
        - ".post-content"
        - ".entry-content"
        - ".article-content"
        - "main"
    
    # Link hovering simulation
    link_hovering:
      enabled: true
      max_hovers_per_page: 3
      hover_duration: [0.5, 2.0]
      hover_probability: 0.4
    
    # Navigation selectors
    navigation_selectors:
      category:
        - "a[href*='category']"
        - "a[href*='cat']"
        - "a[href*='tag']"
        - "nav a"
        - ".category a"
        - ".categories a"
        - "ul.menu a"
        - ".navigation a"
      
      legal_pages:
        - "a[href*='about']"
        - "a[href*='contact']"
        - "a[href*='privacy']"
        - "a[href*='terms']"
        - "a[href*='disclaimer']"
        - "a[href*='faq']"
        - "a[href*='help']"
        - "a[href*='support']"
      
      previous_next:
        - "a[rel='prev']"
        - "a[rel='next']"
        - ".pagination a"
        - ".nav-previous a"
        - ".nav-next a"
        - ".prev a"
        - ".next a"
        - "a[href*='page']"
        - "a[href*='p=']"
  
  # Advanced Behavior System Configuration
  advanced_behavior:
    enabled: true
    
    # Time-based behavior adjustment
    time_based_adjustment: true
    
    # Personality generation
    personality_generation: false
    personality_weights:
      explorer: 0.25
      researcher: 0.25
      casual: 0.25
      professional: 0.25
    
    # Device-specific behavior
    device_detection: true
    device_distribution:
      desktop: 0.6
      mobile: 0.3
      tablet: 0.1
    
    # Geographic behavior patterns
    geo_specific_behavior: true
    geo_behavior_enabled: true
    
    # Content awareness
    content_awareness: true
    content_analysis: true
    
    # Session memory system
    session_memory: true
    memory_persistence: true
    
    # Smart ad interaction
    smart_ad_interaction: true
    context_aware_interaction: true
    
    # 🔥 POST-AD CLICK BEHAVIOR CONFIGURATION
    post_ad_click_behavior:
      enabled: true
      landing_page_behavior: true
      form_interaction: true
      purchase_simulation: true
      back_navigation: true
      
      # Landing page behavior settings
      landing_page:
        dwell_time_min: 10
        dwell_time_max: 30
        reading_probability: 0.8
        scrolling_probability: 0.9
        element_checking: true
      
      # Form interaction settings
      form_interaction:
        email_filling_probability: 0.7
        name_filling_probability: 0.6
        submit_probability: 0.3
        abandon_probability: 0.7
        typing_speed_min: 0.05
        typing_speed_max: 0.15
      
      # Purchase simulation settings
      purchase_simulation:
        product_browsing_probability: 0.6
        add_to_cart_probability: 0.4
        checkout_probability: 0.2
        payment_abandon_probability: 0.8
        max_products_to_browse: 3
      
      # Back navigation settings
      back_navigation:
        enabled: true
        return_probability: 0.9
        continue_browsing_probability: 0.8
  
  # 🔥 STEALTH ENHANCEMENT: Concurrent Behavior Patterns
  concurrent_behavior:
    enabled: true
    behavior_randomization: true
    timing_jitter: true
    pattern_rotation: true
    interaction_diversity: true
    
    # Multiple behavior patterns running concurrently
    concurrent_patterns:
      - "reading_focused"     # Deep reading with long pauses
      - "scanning_mode"       # Quick scanning with frequent scrolls
      - "research_mode"       # Methodical navigation with notes
      - "casual_browsing"     # Random clicks and short attention
    
    # Pattern switching probability
    pattern_switch_probability: 0.2  # 20% chance to switch pattern per page
  
  # 🔥 STEALTH ENHANCEMENT: Connection Stability Management
  connection_management:
    enabled: true
    max_session_duration: 900      # 15 minutes total session (3 pages * 5 min)
    auto_reconnect: true
    silent_recovery: true
    graceful_shutdown: true
    connection_timeout: 30
    retry_attempts: 3
    retry_delay: [2, 5]
  
  # 🔥 STEALTH ENHANCEMENT: Content Interaction Patterns
  content_interaction:
    enabled: true
    ad_detection_threshold: 0.3
    link_click_probability: 0.15
    scroll_depth_target: [0.3, 0.8]
    reading_completion_rate: [0.4, 0.9]
    
    # Text selection and highlighting (human-like behavior)
    text_selection:
      enabled: true
      selection_probability: 0.1    # 10% chance to select text
      highlight_duration: [2, 8]    # Hold selection for 2-8 seconds
    
    # Copy-paste behavior simulation
    copy_paste:
      enabled: true
      copy_probability: 0.05        # 5% chance to copy text
      paste_probability: 0.02       # 2% chance to paste (search, etc.)

